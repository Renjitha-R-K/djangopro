{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}
<title>Job Application</title>
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Apply for {{ job.title }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form|crispy }}

        <button type="submit" class="btn btn-primary">
            Submit Application
        </button>
    </form>

</div>

{% endblock %}
