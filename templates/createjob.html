{% extends 'base.html' %}

{% block title %}

{% endblock %}


{% block content %}
<div class="container w-50 p-5">
    <h1>Create Your Job Here...</h1>

        {% csrf_token %}
        {{form|crispy}}
        <input type="submit" value="Create job" class="btn btn-primary">
    </form>
</div>
{% endblock %}
